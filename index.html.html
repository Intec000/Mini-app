<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Livre de Coloriage</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK officiel Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h2>Créez le livre de votre chat 🐱</h2>
        <p class="subtitle">Téléchargez 3 photos nettes et entrez son nom.</p>

        <form id="bookForm">
            <div class="input-group">
                <label for="catName">Nom du chat :</label>
                <input type="text" id="catName" placeholder="Ex: Moustic" required>
            </div>

            <div class="input-group">
                <label>3 Photos de référence :</label>
                <input type="file" id="photo1" accept="image/*" required>
                <input type="file" id="photo2" accept="image/*" required>
                <input type="file" id="photo3" accept="image/*" required>
            </div>

            <button type="submit" id="submitBtn">Générer mon livre (MVP)</button>
        </form>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Création magique en cours... Ne fermez pas la page.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
